image:
  repository: vllm/vllm-openai
  tag: "v0.8.5"

serviceAccount:
  create: false
  name: ""
  automount: true
  annotations:
    iam.gke.io/gcp-service-account: kubernetes-pods@nonprod1-svc-r4rc.iam.gserviceaccount.com

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

containerPort: 5001

resources:
  limits:
    cpu: "10"
    memory: 30Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "10"
    memory: 30Gi
    nvidia.com/gpu: "1"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: model-cache
    emptyDir: {}
  - name: config-volume
    secret:
      secretName: jinja-config-qwen2
  - name: qwen-tool-code
    secret:
      secretName: qwen-tool-parser-qwen2

volumeMounts:
  - name: model-cache
    mountPath: /root/.cache/huggingface
  - name: config-volume
    mountPath: /etc/config
    readOnly: true
  - name: qwen-tool-code
    mountPath: /app/tools
    readOnly: true

ingress:
  enabled: true
  className: "nginx"
  hosts:
  - host: api-dev.llm4.voicing.ai
    paths:
      - path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - api-dev.llm4.voicing.ai
    secretName: llm-qwen-tls

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

nodeSelector:
  cloud.google.com/gke-accelerator: "nvidia-a100-80gb"
  cloud.google.com/gke-accelerator-count: "1"

pv:
  enabled: false
  storage: 100Gi
pvc:
  enabled: false
  storage: 50Gi
nfs:
  server: "10.90.1.66"
  path: "/videoclone/models/ToolACE-8B"

namespace: dev

container:
  secretName: credentials-qwen2
  secretName2: jinja-config-qwen2
  secretName3: qwen-tool-parser-qwen2

  command: ["/bin/sh", "-c"]
  args:
    - "vllm serve Qwen/Qwen3-30B-A3B-Instruct-2507 \
      --trust-remote-code \
      --enable-chunked-prefill \
      --enable-auto-tool-choice \
      --tool-call-parser=hermes \
      --gpu-memory-utilization 0.90 \
      --port 5001 \
      --max-model-len 4000 \
      --chat-template /etc/config/template.jinja"

  env:
    regular:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: NCCL_P2P_LEVEL
        value: "SYS"
      - name: NCCL_ASYNC_ERROR_HANDLING
        value: "1"
      - name: CUDA_DEVICE_MAX_CONNECTIONS
        value: "1"
      - name: NCCL_IB_DISABLE
        value: "1"
      - name: NCCL_P2P_DISABLE
        value: "0"
      - name: OMP_NUM_THREADS
        value: "8"
      - name: MKL_NUM_THREADS
        value: "8"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_ATTENTION_BACKEND
        value: "flash-attn"
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: "expandable_segments:True"
      - name: VLLM_HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: RAY_NODE_IP_ADDRESS
        valueFrom:
          fieldRef:
            fieldPath: status.podIP

    secret:
      - name: HUGGING_FACE_HUB_TOKEN
        value: "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"

jinjaTemplatePath: "files/qwen3-Instruct.jinja"
