replicaCount: 4

image:
  repository: vllm/vllm-openai
  tag: "v0.8.5"

serviceAccount:
  create: false
  name: ""
  automount: true
  annotations:
    iam.gke.io/gcp-service-account: kubernetes-pods@nonprod1-svc-r4rc.iam.gserviceaccount.com

service:
  type: ClusterIP
  port: 80
  targetPort: 5001

containerPort: 5001

resources:
  limits:
    cpu: "10"
    memory: 60Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "10"
    memory: 60Gi
    nvidia.com/gpu: "1"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: model-cache
    emptyDir: {}
  - name: config-volume
    secret:
      secretName: jinja-config-qwen
  - name: qwen-tool-code
    secret:
      secretName: qwen-tool-parser-qwen
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 50Gi

volumeMounts:
  - name: model-cache
    mountPath: /root/.cache/huggingface
  - name: config-volume
    mountPath: /etc/config
    readOnly: true
  - name: qwen-tool-code
    mountPath: /app/tools
    readOnly: true
  - name: dshm
    mountPath: /dev/shm

ingress:
  enabled: true
  className: "nginx"
  hosts:
  - host: api-dev.llm4.voicing.ai
    paths:
      - path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - api-dev.llm4.voicing.ai
    secretName: llm-qwen-tls

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

nodeSelector:
  cloud.google.com/gke-accelerator: "nvidia-l4"
  cloud.google.com/gke-accelerator-count: "1"

pv:
  enabled: false
  storage: 100Gi
pvc:
  enabled: false
  storage: 50Gi
nfs:
  server: "10.90.1.66"
  path: "/videoclone/models/ToolACE-8B"

namespace: dev

container:
  secretName: credentials-qwen
  secretName2: jinja-config-qwen
  secretName3: qwen-tool-parser-qwen

  command: ["/bin/sh", "-c"]
  args:
    - "vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ \
      --tensor-parallel-size 1 \
      --max-model-len 4000 \
      --port 5001 \
      --enable-chunked-prefill \
      --max-num-batched-tokens 65000 \
      --enforce-eager \
      --max-num-seqs 256 \
      --gpu-memory-utilization 0.90"

  env:
    regular:
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: NCCL_P2P_LEVEL
        value: "SYS"
      - name: NCCL_ASYNC_ERROR_HANDLING
        value: "1"
      - name: CUDA_DEVICE_MAX_CONNECTIONS
        value: "1"
      - name: NCCL_IB_DISABLE
        value: "1"
      - name: NCCL_P2P_DISABLE
        value: "0"
      - name: OMP_NUM_THREADS
        value: "8"
      - name: MKL_NUM_THREADS
        value: "8"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_ATTENTION_BACKEND
        value: "flash-attn"
      - name: PYTORCH_CUDA_ALLOC_CONF
        value: "expandable_segments:True"
      - name: VLLM_HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: RAY_NODE_IP_ADDRESS
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      # - name: CUDA_DEVICE_MAX_CONNECTIONS
      #   value: "1"
      # - name: NCCL_BLOCKING_WAIT
      #   value: "1"
      # - name: TORCH_NCCL_AVOID_RECORD_STREAMS
      #   value: "1"

    secret:
      - name: HUGGING_FACE_HUB_TOKEN
        value: "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"

jinjaTemplatePath: "files/template-qwen.jinja"

podAnnotations:
  autopilot.gke.io/resource-limits: |
    {"nvidia.com/gpu": "4"}
