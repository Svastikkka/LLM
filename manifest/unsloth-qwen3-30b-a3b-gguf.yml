apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-download-script
  namespace: dev
data:
  download_model.py: |
    import os, glob, sys
    from huggingface_hub import snapshot_download, login

    token = os.environ.get("HF_TOKEN", "").strip()
    if token:
        login(token=token, add_to_git_credential=False)

    local_dir = "/models"
    repo_id = "unsloth/Qwen3-30B-A3B-GGUF"
    print(f"Downloading model {repo_id} to {local_dir} ...", flush=True)

    snapshot_download(
        repo_id=repo_id,
        local_dir=local_dir,
        allow_patterns=["**/Q4_K_M/**", "*Q4_K_M*.gguf"]
    )

    candidates = glob.glob(os.path.join(local_dir, "**", "Q4_K_M", "*.gguf"), recursive=True)
    if not candidates:
        candidates = glob.glob(os.path.join(local_dir, "**", "*Q4_K_M*.gguf"), recursive=True)
    if not candidates:
        print("ERROR: No Q4_K_M .gguf files found.", file=sys.stderr)
        sys.exit(1)

    target = sorted(candidates)[0]
    link = os.path.join(local_dir, "model.gguf")
    if os.path.islink(link) or os.path.exists(link):
        os.unlink(link)
    os.symlink(target, link)
    print(f"Linked {link} -> {target}", flush=True)
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: dev
type: Opaque
stringData:
  HF_TOKEN: ""    # optional Hugging Face token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen30b-llamacpp
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen30b-llamacpp
  template:
    metadata:
      labels:
        app: qwen30b-llamacpp
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: h100pool2
        kubernetes.io/arch: amd64
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      containers:
        - name: server
          image: ghcr.io/ggerganov/llama.cpp:server-cuda
          imagePullPolicy: IfNotPresent
          args:
            - -m
            - /models/model.gguf
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - -c
            - "8192"        # context size
            - -ngl
            - "999"         # GPU layers
            - -t
            - "16"          # threads
            - --parallel
            - "8"
            - --batch-size
            - "512"
            - --api-key
            - sk-dev-qwen3
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
      initContainers:
        - name: download-model
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir "huggingface_hub>=0.23"
              echo "Starting model download..."
              python /scripts/download_model.py
              echo "Model download complete!"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          volumeMounts:
            - name: models
              mountPath: /models
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: models
          emptyDir:
            sizeLimit: "50Gi"
        - name: script
          configMap:
            name: qwen3-download-script
---
apiVersion: v1
kind: Service
metadata:
  name: qwen30b-svc
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: qwen30b-llamacpp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
